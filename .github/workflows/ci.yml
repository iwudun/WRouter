name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 DCO 签名
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          missing=0
          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::提交 $sha 缺少 Signed-off-by（请用 git commit -s）"
              missing=1
            fi
          done
          exit $missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  contracts-and-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-capabilities.mjs
      - run: npm run version:check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo test --workspace
        working-directory: backend
