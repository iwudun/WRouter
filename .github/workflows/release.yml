name: Release

# 打 tag（v*）时自动构建两个平台的安装包并挂到 Release；
# 也可在 Actions 页面手动触发（workflow_dispatch），产物只留在 Artifacts。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  # 在共享的 wrouter-linux-builder:v2 之上补齐 dpkg/fakeroot，
  # 同时供 WRouter（rpm）与 WCode（rpm/deb/AppImage）使用。
  BUILDER_IMAGE: ghcr.io/iwudun/linux-electron-builder:v2

jobs:
  windows:
    name: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # 根 package.json 没有依赖，npm ci 不会建出 node_modules/，
      # 而 scripts/build.mjs 的预检要求它存在，故显式创建空目录。
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix desktop ci
          New-Item -ItemType Directory node_modules -Force | Out-Null

      - name: Build NSIS installer
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/dist/**/win/*.exe
          if-no-files-found: error

  linux:
    name: linux-rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # 后端交叉编译到 musl 需要 musl-gcc。
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # 容器内 rpmbuild 依赖这套预装依赖的镜像（Rocky 8.10 + rpm-build），
      # 在 runner 上现建约 10 分钟且会随 dnf 源漂移，故从 GHCR 拉取。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull builder image
        run: docker pull "$BUILDER_IMAGE"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          mkdir -p node_modules

      - name: Build RPM
        run: npm run build:rpm
        env:
          WROUTER_BUILDER_IMAGE: ${{ env.BUILDER_IMAGE }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: build/dist/**/linux/*.rpm
          if-no-files-found: error

  publish:
    name: publish-release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.rpm
          fail_on_unmatched_files: true
