[package]
name = "wrouter-desktop"
description = "WRouter Tauri 桌面壳(Electron→Tauri 迁移 P3)"
version = "0.0.0"
edition = "2024"
publish = false
# crate 版本号不是对外版本来源;运行时版本来自根 package.json(WR_VERSION)。

[lib]
name = "wrouter_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# 后端服务层:同进程嵌入(不走子进程),故为 path 依赖。
wr-server = { path = "../../backend/crates/wr-server" }

[workspace]
# 独立 Cargo 工程(刻意不并入 backend workspace):
#   1) backend 的 wr-domain 纯度守护与「离线可解」约束不受桌面壳依赖影响;
#   2) Tauri v2 依赖树(~200 crate)不污染 backend/Cargo.lock;
#   3) 桌面壳可以独立 `cargo build` / `cargo tauri dev`,不牵动后端门禁。
